name: Deploy www.idnet.id
run-name: ${{ github.actor }} is deploying www.idnet.id🚀
on: [push]
env:
  SSH_COMMAND: ssh -p 2222 deploy@103.172.196.74
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key of VM
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY_PAIR }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Git pulling the latest commits
        run: $SSH_COMMAND git -C /srv/www/idnet.id pull origin main --rebase
      - run: |
          $SSH_COMMAND <<EOF
            cd /srv/www/idnet.id
            composer install
          EOF
      - name: Restart nginx web server
        run: $SSH_COMMAND sudo systemctl restart nginx

name: Deploy www.idnet.id
run-name: ${{ github.actor }} is deploying www.idnet.id🚀
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key of VM
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY_PAIR }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - run: ssh -p 2222 deploy@103.172.196.74 touch hello.txt
